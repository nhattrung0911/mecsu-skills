[pytest]
# %TEMP% cua Windows co the bi chan (sandbox, chinh sach may). Khi do pytest
# khong tao noi thu muc tam mac dinh va BAO LOI HANG LOAT:
#
#     PermissionError: [WinError 5] Access is denied:
#     'C:\Users\...\AppData\Local\Temp\pytest-of-...'
#
# Trong nguc canh do `python -m pytest -q` - dung lenh ma CLAUDE.md, AGENTS.md
# va docs/ deu bao chay - hong 23 test, trong khi CI tren Linux van xanh. Do lai
# 2026-09-11 tren hai phien khac nhau, ca hai deu dinh.
#
# Chot thu muc tam ngay trong repo de lenh tran chay duoc o moi may.
# CANH BAO: pytest XOA SACH thu muc nay moi lan chay, nen dung tro no vao
# bat cu cho nao dang chua thu can giu.
addopts = --basetemp=.pytest_tmp

# KHONG dat `testpaths` o day. Dat no se loai lab/ khoi pham vi, trong khi buoc 3
# cua flow dung skill bao chay `pytest -q` de kiem chinh ban nhap trong lab/.
# CI khong bi anh huong: lab/ nam trong .gitignore nen runner khong thay no.
